[project]
name = "semindex"
version = "0.0.1"
description = "Distributed Semantic Index synchronization over Cefore"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Figures in semindex.evalagg only; the agent never imports it, so Mininet
# hosts do not need it.
plot = ["matplotlib>=3.11"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Pin the rule set instead of inheriting ruff's default, which grew between
# 0.15 and 0.17 (SIM/UP/PERF/...): without this, a ruff upgrade in uv.lock
# would silently change what the CI lint gate enforces. This is the set the
# tree was checked against when the gate was introduced.
select = ["E4", "E7", "E9", "F"]
